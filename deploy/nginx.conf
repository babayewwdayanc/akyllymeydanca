# Nginx перед Node.js. Пока без домена и SSL — сайт открывается по IP сервера (http://IP).
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/akylly
#   sudo ln -sf /etc/nginx/sites-available/akylly /etc/nginx/sites-enabled/akylly
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Когда будет домен: впишите его в server_name и выполните  sudo certbot --nginx -d ваш-домен

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Видео матча может весить несколько гигабайт
    client_max_body_size 30G;
    client_body_timeout 3600s;
    # Большой файл сразу передаётся в приложение, а не копится на диске Nginx
    proxy_request_buffering off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Фото, кадры и видео отдаёт сам Nginx — быстрее и не нагружает Node.js
    location /media/photos/ {
        alias /opt/akylly/data/photos/;
        expires 30d;
        access_log off;
    }
    location /media/thumbs/ {
        alias /opt/akylly/data/thumbs/;
        expires 7d;
        access_log off;
    }
    location /media/videos/ {
        alias /opt/akylly/data/videos/;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Удаление фона и демо-анализ могут занимать до минуты, загрузка видео — дольше
        proxy_read_timeout 600s;
        proxy_send_timeout 3600s;
    }
}
